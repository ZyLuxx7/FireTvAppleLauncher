plugins {
    id 'com.android.application'
}

def releaseSigningValues = [
        keystore     : providers.gradleProperty('releaseKeystore').orNull
                ?: System.getenv('APPLE_LAUNCHER_RELEASE_KEYSTORE'),
        storePassword: providers.gradleProperty('releaseStorePassword').orNull
                ?: System.getenv('APPLE_LAUNCHER_RELEASE_STORE_PASSWORD'),
        keyAlias     : providers.gradleProperty('releaseKeyAlias').orNull
                ?: System.getenv('APPLE_LAUNCHER_RELEASE_KEY_ALIAS'),
        keyPassword  : providers.gradleProperty('releaseKeyPassword').orNull
                ?: System.getenv('APPLE_LAUNCHER_RELEASE_KEY_PASSWORD')
]
def releaseSigningConfigured = releaseSigningValues.values().every {
    it != null && !it.trim().isEmpty()
}

android {
    namespace 'com.appletv.launcher'
    compileSdk 36

    defaultConfig {
        applicationId "com.appletv.launcher.firetv"
        minSdk 28
        targetSdk 34
        versionCode 9
        versionName "1.0.3-firetv"
        resConfigs "en", "de", "fr", "es"
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile project.file(releaseSigningValues.keystore)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
        }
    }

    tasks.configureEach { task ->
        if (task.name == 'preReleaseBuild') {
            task.doFirst {
                if (!releaseSigningConfigured) {
                    throw new GradleException('Release signing is not configured. Set releaseKeystore, '
                            + 'releaseStorePassword, releaseKeyAlias, and releaseKeyPassword locally.')
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    packaging {
        dex {
            useLegacyPackaging = true
        }
        resources {
            excludes += 'kotlin/**'
            excludes += '**/*.kotlin_builtins'
            excludes += '**/*.kotlin_metadata'
            excludes += 'META-INF/*.version'
            excludes += 'META-INF/androidx.*'
            excludes += 'META-INF/com/android/build/gradle/*'
        }
    }
}
dependencies {
    implementation project(':liquidglass')
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    testImplementation 'junit:junit:4.13.2'
}
