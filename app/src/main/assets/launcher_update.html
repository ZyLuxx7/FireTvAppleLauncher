<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080a0f;
      color: #f7f7fa;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(16px, 5vw, 56px);
      background:
        radial-gradient(ellipse at 18% 0%, rgba(91, 112, 199, .28), transparent 48%),
        radial-gradient(ellipse at 90% 100%, rgba(69, 183, 174, .18), transparent 42%),
        #080a0f;
    }
    main { width: min(760px, 100%); margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 680; letter-spacing: .01em; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 15px;
      background: linear-gradient(145deg, rgba(255,255,255,.25), rgba(255,255,255,.06));
      border: 1px solid rgba(255,255,255,.2);
      box-shadow: 0 8px 26px rgba(0,0,0,.25);
    }
    .local-tag {
      color: #a7e7dc;
      font-size: .75rem;
      letter-spacing: .1em;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(143,227,216,.25);
      background: rgba(68,160,151,.12);
      white-space: nowrap;
    }
    .panel {
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 28px;
      padding: clamp(22px, 5vw, 38px);
      background: linear-gradient(145deg, rgba(31,34,43,.86), rgba(16,18,24,.92));
      box-shadow: 0 22px 70px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
    }
    h1 { font-size: clamp(1.7rem, 5vw, 2.45rem); line-height: 1.12; margin: 0 0 10px; }
    h2 { font-size: 1.1rem; margin: 26px 0 0; }
    .intro, .hint { color: #aeb2bd; line-height: 1.55; }
    .intro { margin: 0 0 22px; }
    label { display: block; font-size: .88rem; font-weight: 650; margin: 18px 0 8px; }
    input, textarea {
      width: 100%;
      color: #f6f7fb;
      font: inherit;
      border-radius: 15px;
      padding: 14px 15px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.25);
      outline: none;
    }
    input:focus, textarea:focus { border-color: #83d2ca; box-shadow: 0 0 0 3px rgba(131,210,202,.13); }
    #pin { letter-spacing: .24em; max-width: 230px; }
    input[type="file"] { max-width: none; letter-spacing: normal; padding: 11px 12px; }
    textarea { min-height: 138px; resize: vertical; letter-spacing: normal; }
    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 19px;
      color: #081012;
      font: inherit;
      font-weight: 720;
      background: linear-gradient(120deg, #a4e7df, #7acbc2);
      cursor: pointer;
      box-shadow: 0 8px 26px rgba(68,173,165,.18);
      transition: transform .18s ease, filter .18s ease;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.05); }
    button:disabled { opacity: .48; cursor: not-allowed; }
    .secondary {
      color: #f5f6fa;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: none;
    }
    .session-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 15px;
      margin: 0 0 20px;
      border: 1px solid rgba(143,227,216,.2);
      border-radius: 16px;
      background: linear-gradient(120deg, rgba(68,160,151,.15), rgba(255,255,255,.035));
    }
    .session-dot { width: 10px; height: 10px; border-radius: 50%; background: #52d6ba; box-shadow: 0 0 14px rgba(82,214,186,.6); }
    .session-copy { display: grid; gap: 3px; flex: 1; }
    .session-copy strong { font-size: .9rem; }
    .session-copy small { color: #aeb2bd; }
    .session-time { color: #b7f0e7; font: 650 .82rem/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .status { min-height: 26px; margin: 16px 0 0; color: #c5cad5; line-height: 1.5; }
    .status.error { color: #ffaaa8; }
    .status.success { color: #9ce5d8; }
    .status.warning { color: #ffd58a; }
    .candidate-list { display: grid; gap: 12px; margin-top: 15px; }
    .candidate {
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 17px;
      background: rgba(255,255,255,.045);
    }
    .candidate-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .candidate-title { font-weight: 680; overflow-wrap: anywhere; }
    .candidate-message { color: #aeb2bd; font-size: .9rem; line-height: 1.45; margin-top: 7px; }
    .fingerprint {
      color: #858b98;
      font: .72rem/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      overflow-wrap: anywhere;
      margin-top: 11px;
    }
    .candidate button { margin-top: 14px; }
    .source-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #858b98;
      font-size: .82rem;
      margin: 18px 0;
    }
    .source-divider::before, .source-divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: rgba(255,255,255,.12);
    }
    .hidden { display: none !important; }
    footer { color: #858b98; font-size: .78rem; line-height: 1.5; margin: 18px 4px 0; }
    @media (max-width: 520px) {
      body { padding: 16px; }
      header { align-items: flex-start; }
      .local-tag { font-size: .65rem; }
      .panel { border-radius: 23px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand"><span class="brand-mark" aria-hidden="true">TV</span><span>Apple TV Launcher</span></div>
    <span class="local-tag">LOCAL WI-FI</span>
  </header>
  <section class="panel">
    <h1 id="title"></h1>
    <p class="intro" id="intro"></p>
    <div class="session-card hidden" id="session-card" role="status" aria-live="polite">
      <span class="session-dot" aria-hidden="true"></span>
      <span class="session-copy"><strong id="session-state"></strong><small id="session-countdown"></small></span>
      <span class="session-time" id="session-time"></span>
    </div>
    <form id="pairing-form">
      <label id="pin-label" for="pin"></label>
      <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" type="password" required>
      <button class="secondary" id="verify" type="submit"></button>
    </form>
    <form id="links-form" class="hidden">
      <label id="links-label" for="links"></label>
      <textarea id="links" autocomplete="off" spellcheck="false">https://github.com/ZyLuxx7/FireTvAppleLauncher/releases/download/v1.0.3-test/AppleTVLauncher.apk</textarea>
      <p class="hint" id="links-hint"></p>
      <button id="check" type="submit"></button>
    </form>
    <p class="source-divider hidden" id="upload-or"></p>
    <form id="upload-form" class="hidden">
      <label id="upload-label" for="apk-file"></label>
      <input id="apk-file" type="file" accept=".apk,application/vnd.android.package-archive" required>
      <p class="hint" id="upload-hint"></p>
      <button id="upload-button" type="submit"></button>
    </form>
    <p class="status" id="status" aria-live="polite"></p>
    <section class="hidden" id="candidates-section">
      <h2 id="candidates-title"></h2>
      <div class="candidate-list" id="candidates"></div>
    </section>
  </section>
  <footer id="footer"></footer>
</main>
<script>
  const T = {
    title: {{TITLE}},
    intro: {{INTRO}},
    pinLabel: {{PIN_LABEL}},
    linksLabel: {{LINKS_LABEL}},
    linksHint: {{LINKS_HINT}},
    uploadOr: {{UPLOAD_OR}},
    uploadLabel: {{UPLOAD_LABEL}},
    uploadHint: {{UPLOAD_HINT}},
    uploadButton: {{UPLOAD_BUTTON}},
    uploadProgress: {{UPLOAD_PROGRESS}},
    uploadInvalid: {{UPLOAD_INVALID}},
    uploadFailed: {{UPLOAD_FAILED}},
    verifyButton: {{VERIFY_BUTTON}},
    submitButton: {{SUBMIT_BUTTON}},
    candidatesTitle: {{CANDIDATES_TITLE}},
    installButton: {{INSTALL_BUTTON}},
    enterPin: {{ENTER_PIN}},
    badPin: {{BAD_PIN}},
    expired: {{EXPIRED}},
    verifying: {{VERIFYING}},
    noCandidates: {{NO_CANDIDATES}},
    installSent: {{INSTALL_SENT}},
    versionLabel: {{VERSION_LABEL}},
    hashLabel: {{HASH_LABEL}},
    signerLabel: {{SIGNER_LABEL}},
    error: {{ERROR}},
    connectionLost: {{CONNECTION_LOST}},
    ready: {{READY}},
    queued: {{QUEUED}},
    downloading: {{DOWNLOADING}},
    installing: {{INSTALLING}},
    connected: {{CONNECTED}},
    waiting: {{WAITING}},
    countdown: {{COUNTDOWN}},
    processing: {{PROCESSING}},
    installUnknown: {{INSTALL_UNKNOWN}},
    installComplete: {{INSTALL_COMPLETE}},
    installCancelled: {{INSTALL_CANCELLED}},
    installFailed: {{INSTALL_FAILED}},
    footer: {{FOOTER}}
  };
  const maxApkBytes = {{MAX_APK_BYTES}};
  const base = location.pathname.replace(/\/$/, "");
  const pin = document.getElementById("pin");
  const apkFile = document.getElementById("apk-file");
  const statusNode = document.getElementById("status");
  const candidatesNode = document.getElementById("candidates");
  let paired = false;
  let polling = false;
  let installPending = false;
  let submissionStarted = false;
  let candidateSignature = "";
  let sessionRemainingAtSync = null;
  let sessionSyncAt = 0;

  function showStatus(text, kind) {
    statusNode.textContent = text || "";
    statusNode.className = "status" + (kind ? " " + kind : "");
  }
  function apiErrorMessage(error, fallback) {
    return error && error.httpStatus ? error.message || fallback : fallback;
  }
  async function api(action, extra) {
    const response = await fetch(base + "/api", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      cache: "no-store",
      body: JSON.stringify(Object.assign({ action: action, pin: pin.value }, extra || {}))
    });
    const data = await response.json();
    if (!response.ok || !data.ok) {
      const error = new Error(data.message || T.error);
      error.httpStatus = response.status;
      throw error;
    }
    return data;
  }
  function uploadApk(file) {
    return new Promise((resolve, reject) => {
      const request = new XMLHttpRequest();
      request.open("POST", base + "/upload", true);
      request.setRequestHeader("Content-Type", "application/vnd.android.package-archive");
      request.setRequestHeader("X-Launcher-Update-Pin", pin.value);
      request.setRequestHeader("Cache-Control", "no-store");
      request.upload.addEventListener("progress", event => {
        const progress = event.lengthComputable
          ? Math.round((event.loaded / event.total) * 100) + "%"
          : "";
        showStatus(T.uploadProgress.replace("%1$s", progress), "warning");
      });
      request.addEventListener("load", () => {
        let data;
        try {
          data = JSON.parse(request.responseText);
        } catch (error) {
          reject(new Error(T.error));
          return;
        }
        if (request.status < 200 || request.status >= 300 || !data.ok) {
          const error = new Error(data.message || T.error);
          error.httpStatus = request.status;
          reject(error);
          return;
        }
        resolve(data);
      });
      request.addEventListener("error", () => reject(new Error(T.uploadFailed)));
      request.addEventListener("abort", () => reject(new Error(T.uploadFailed)));
      request.send(file);
    });
  }
  function textForStatus(status) {
    if (status === "queued") return T.queued;
    if (status === "downloading") return T.downloading;
    if (status === "ready") return T.ready;
    if (status === "installing") return T.installing;
    return T.error;
  }
  function showCandidateResult(state) {
    if (state.working || installPending) return;
    const items = state.candidates || [];
    if (items.some(item => item.status === "ready")) {
      showStatus(T.ready, "success");
      return;
    }
    const failed = items.find(item => item.status === "error");
    if (failed) showStatus(failed.message || T.uploadFailed, "error");
  }
  function updateSession(state) {
    const card = document.getElementById("session-card");
    card.classList.remove("hidden");
    document.getElementById("session-state").textContent = state.connected ? T.connected : T.waiting;
    const remaining = Number(state.remainingMs);
    if (!Number.isFinite(remaining)) {
      sessionRemainingAtSync = null;
      document.getElementById("session-countdown").textContent = T.error;
      document.getElementById("session-time").textContent = "—";
    } else {
      sessionRemainingAtSync = remaining;
      sessionSyncAt = performance.now();
      renderSessionCountdown();
    }
  }
  function renderSessionCountdown() {
    if (sessionRemainingAtSync === null) return;
    if (sessionRemainingAtSync < 0) {
      document.getElementById("session-countdown").textContent = T.processing;
      document.getElementById("session-time").textContent = "•••";
    } else {
      const elapsed = Math.max(0, performance.now() - sessionSyncAt);
      const seconds = Math.max(0, Math.ceil((sessionRemainingAtSync - elapsed) / 1000));
      const time = String(Math.floor(seconds / 60)).padStart(2, "0")
        + ":" + String(seconds % 60).padStart(2, "0");
      document.getElementById("session-countdown").textContent = T.countdown.replace("%1$s", time);
      document.getElementById("session-time").textContent = time;
    }
  }
  function renderCandidates(items) {
    const signature = JSON.stringify(items);
    if (signature === candidateSignature) return;
    candidateSignature = signature;
    candidatesNode.replaceChildren();
    document.getElementById("candidates-section").classList.remove("hidden");
    if (!items.length) {
      showStatus(T.noCandidates);
      return;
    }
    for (const item of items) {
      const card = document.createElement("article");
      card.className = "candidate";
      const title = document.createElement("div");
      title.className = "candidate-title";
      title.textContent = T.versionLabel + ": " + (item.versionName || "—")
        + " (" + (item.versionCode || "—") + ")";
      const message = document.createElement("div");
      message.className = "candidate-message";
      message.textContent = item.message || textForStatus(item.status);
      card.appendChild(title);
      card.appendChild(message);
      if (item.apkSha256) {
        const fingerprint = document.createElement("div");
        fingerprint.className = "fingerprint";
        fingerprint.textContent = T.hashLabel + ": " + item.apkSha256;
        card.appendChild(fingerprint);
      }
      if (item.signerSha256) {
        const signer = document.createElement("div");
        signer.className = "fingerprint";
        signer.textContent = T.signerLabel + ": " + item.signerSha256;
        card.appendChild(signer);
      }
      if (item.status === "ready" && !installPending) {
        const install = document.createElement("button");
        install.type = "button";
        install.textContent = T.installButton;
        install.addEventListener("click", async () => {
          install.disabled = true;
          installPending = true;
          showStatus(T.installing, "warning");
          try {
            const result = await api("install", { candidateId: item.id });
            showStatus(result.message || T.installSent, "success");
            startPolling();
          } catch (error) {
            if (error.httpStatus) {
              installPending = false;
              showStatus(error.message || T.error, "error");
              install.disabled = false;
            } else {
              showStatus(T.installUnknown, "warning");
              polling = false;
            }
          }
        });
        card.appendChild(install);
      }
      candidatesNode.appendChild(card);
    }
  }
  function applyInstallState(state) {
    if (state.installState === "installed") {
      installPending = false;
      polling = false;
      showStatus(T.installComplete, "success");
      return true;
    }
    if (state.installState === "cancelled") {
      installPending = false;
      polling = false;
      showStatus(T.installCancelled, "warning");
      return true;
    }
    if (state.installState === "failed") {
      installPending = false;
      polling = false;
      showStatus(T.installFailed, "error");
      return true;
    }
    return false;
  }
  function startPolling() {
    if (polling) return;
    polling = true;
    poll();
  }
  async function poll() {
    while (polling) {
      try {
        const state = await api("status");
        updateSession(state);
        if (state.expired) {
          polling = false;
          showStatus(T.expired, "error");
          return;
        }
        if (state.submitted) {
          renderCandidates(state.candidates || []);
          showCandidateResult(state);
        }
        if (applyInstallState(state)) return;
        if (installPending && state.installState === "pending") showStatus(T.installing, "warning");
        await new Promise(resolve => setTimeout(resolve, state.working || installPending ? 1500 : 5000));
      } catch (error) {
        polling = false;
        if (installPending) {
          showStatus(T.installUnknown, "warning");
        } else {
          showStatus(apiErrorMessage(error, T.connectionLost), "error");
        }
      }
    }
  }
  document.getElementById("title").textContent = T.title;
  document.getElementById("intro").textContent = T.intro;
  document.getElementById("pin-label").textContent = T.pinLabel;
  document.getElementById("links-label").textContent = T.linksLabel;
  document.getElementById("links-hint").textContent = T.linksHint;
  document.getElementById("upload-or").textContent = T.uploadOr;
  document.getElementById("upload-label").textContent = T.uploadLabel;
  document.getElementById("upload-hint").textContent = T.uploadHint;
  document.getElementById("upload-button").textContent = T.uploadButton;
  document.getElementById("verify").textContent = T.verifyButton;
  document.getElementById("check").textContent = T.submitButton;
  document.getElementById("candidates-title").textContent = T.candidatesTitle;
  document.getElementById("footer").textContent = T.footer;
  window.setInterval(renderSessionCountdown, 1000);
  document.getElementById("pairing-form").addEventListener("submit", async event => {
    event.preventDefault();
    if (!/^\d{6}$/.test(pin.value)) {
      showStatus(T.enterPin, "error");
      return;
    }
    showStatus(T.verifying);
    try {
      await api("verify");
      paired = true;
      document.getElementById("links-form").classList.remove("hidden");
      document.getElementById("upload-or").classList.remove("hidden");
      document.getElementById("upload-form").classList.remove("hidden");
      document.getElementById("pairing-form").classList.add("hidden");
      showStatus("");
      startPolling();
    } catch (error) {
      showStatus(apiErrorMessage(error, T.connectionLost), "error");
    }
  });
  document.getElementById("links-form").addEventListener("submit", async event => {
    event.preventDefault();
    if (!paired || submissionStarted) return;
    const urls = document.getElementById("links").value
      .split(/\r?\n/).map(value => value.trim()).filter(Boolean);
    if (urls.length < 1 || urls.length > 5) {
      showStatus(T.error, "error");
      return;
    }
    submissionStarted = true;
    document.getElementById("check").disabled = true;
    document.getElementById("upload-button").disabled = true;
    apkFile.disabled = true;
    showStatus(T.verifying);
    try {
      const state = await api("submit", { urls: urls });
      renderCandidates(state.candidates || []);
      if (state.working) showStatus(T.downloading, "warning");
      else if (!state.candidates || !state.candidates.length) showStatus(T.noCandidates, "error");
      startPolling();
    } catch (error) {
      showStatus(apiErrorMessage(error, T.connectionLost), "error");
      submissionStarted = false;
      document.getElementById("check").disabled = false;
      document.getElementById("upload-button").disabled = false;
      apkFile.disabled = false;
    }
  });
  document.getElementById("upload-form").addEventListener("submit", async event => {
    event.preventDefault();
    if (!paired || submissionStarted) return;
    const file = apkFile.files && apkFile.files[0];
    if (!file || file.size < 1 || file.size > maxApkBytes) {
      showStatus(T.uploadInvalid, "error");
      return;
    }
    submissionStarted = true;
    document.getElementById("check").disabled = true;
    document.getElementById("upload-button").disabled = true;
    apkFile.disabled = true;
    showStatus(T.uploadProgress.replace("%1$s", "0%"), "warning");
    try {
      const state = await uploadApk(file);
      renderCandidates(state.candidates || []);
      if (state.working) showStatus(T.downloading, "warning");
      else showCandidateResult(state);
      startPolling();
    } catch (error) {
      showStatus(error.message || T.uploadFailed, "error");
      startPolling();
    }
  });
</script>
</body>
</html>
